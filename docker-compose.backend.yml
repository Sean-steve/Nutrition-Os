# Local development PostgreSQL only. Do not expose to the public Internet.
services:
  nutrition-postgres:
    image: postgres:16-alpine
    container_name: nutrition-os-postgres-local
    environment:
      POSTGRES_DB: nutrition_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nutrition_dev_admin_2026
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - nutrition_pg_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition_os"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  nutrition_pg_local:
