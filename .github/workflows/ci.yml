name: Nutrition OS — frontend and PostgreSQL backend CI
on:
  push:
    branches: ["main", "feat/**", "feature/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nutrition_dev_admin_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutrition_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nutrition_app:nutrition_dev_only_2026@127.0.0.1:5432/nutrition_os
      MIGRATION_DATABASE_URL: postgresql://postgres:nutrition_dev_admin_2026@127.0.0.1:5432/nutrition_os
      ENABLE_DEV_DB_ROLE: "true"
      DEV_DB_ROLE_PASSWORD: nutrition_dev_only_2026
      LOCAL_IDENTITY_ENABLED: "true"
      LOCAL_IDENTITY_SECRET: nutrition-test-local-signing-secret-not-for-production-2026
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend TypeScript
        run: npm run check
      - name: Frontend unit tests
        run: npm run test
      - name: Frontend production build
        run: npm run build
      - name: Backend dependencies
        run: npm --prefix server install --no-audit --no-fund
      - name: PostgreSQL migrations and dev-only app role
        run: npm --prefix server run db:migrate
      - name: Backend TypeScript
        run: npm --prefix server run check
      - name: Backend unit tests
        run: npm --prefix server run test
      - name: Backend build
        run: npm --prefix server run build
      - name: PostgreSQL integration and RLS certification
        run: npm --prefix server run test:integration
      - name: Staging configuration / identity fail-closed certification
        run: |
          node --test scripts/staging/*.test.mjs
          node scripts/staging/certify.mjs --dry-run --expect-blocked --output phase8-1-offline-evidence.json
      - name: Validate staging private networking and separate migrator Docker Compose
        run: bash scripts/staging/compose-ci.sh
      - name: Runtime dependency vulnerability audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high
      - name: Disposable backup and actual database restore drill
        run: bash scripts/backup-restore-ci.sh
      - name: Machine-readable release readiness gate (expected NOT READY)
        run: node scripts/release-gate.mjs --expect-blocked --output release-gate.json
      - name: Upload Phase 8 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-release-evidence
          path: |
            release-gate.json
            phase8-1-offline-evidence.json
          if-no-files-found: ignore

  browser:
    name: Browser UX and accessibility certification (local API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nutrition_dev_admin_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutrition_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nutrition_app:nutrition_dev_only_2026@127.0.0.1:5432/nutrition_os
      MIGRATION_DATABASE_URL: postgresql://postgres:nutrition_dev_admin_2026@127.0.0.1:5432/nutrition_os
      ENABLE_DEV_DB_ROLE: "true"
      DEV_DB_ROLE_PASSWORD: nutrition_dev_only_2026
      LOCAL_IDENTITY_ENABLED: "true"
      LOCAL_IDENTITY_SECRET: nutrition-test-local-signing-secret-not-for-production-2026
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and backend dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
      - name: Install Playwright browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Apply PostgreSQL migrations and restricted app role
        run: npm --prefix server run db:migrate
      - name: Issue short-lived local test-only token for browser suite
        run: |
          TOKEN="$(npm --prefix server run --silent dev:token)"
          printf 'E2E_TEST_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
      - name: Desktop and mobile browser E2E / WCAG scan
        run: npm run test:e2e
      - name: Upload browser failure evidence (test-only data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
